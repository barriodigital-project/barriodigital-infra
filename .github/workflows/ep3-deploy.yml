name: EP3 deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-ep3
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EP3_STACK_NAME: ${{ vars.EP3_STACK_NAME }}
      MANAGER_INSTANCE_ID: ${{ vars.MANAGER_INSTANCE_ID }}
      WORKER_INSTANCE_ID: ${{ vars.WORKER_INSTANCE_ID }}
      MANAGER_PRIVATE_IP: ${{ vars.MANAGER_PRIVATE_IP }}
      WORKER_PRIVATE_IP: ${{ vars.WORKER_PRIVATE_IP }}
      VPC_ID: ${{ vars.VPC_ID }}
      VPC_SUBNET_IDS: ${{ vars.VPC_SUBNET_IDS }}
      SWARM_SECURITY_GROUP_ID: ${{ vars.SWARM_SECURITY_GROUP_ID }}
      LAMBDA_ROLE_NAME: LabRole
      JWT_ISSUER_URI: ${{ vars.JWT_ISSUER_URI }}
      JWT_CLIENT_ID: ${{ vars.JWT_CLIENT_ID }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: lambda/report-event-consumer/pom.xml

      - name: Test Lambda consumer
        run: mvn -B -f lambda/report-event-consumer/pom.xml clean verify

      - name: Configure temporary AWS Academy credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify the Manager is available in Systems Manager
        run: |
          status="$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$MANAGER_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          [[ "$status" == "Online" ]] || {
            printf 'The existing Manager must be online in Systems Manager; status: %s\n' "$status" >&2
            exit 1
          }

      - name: Prepare deployment parameters
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in AWS_REGION EP3_STACK_NAME MANAGER_INSTANCE_ID WORKER_INSTANCE_ID \
            MANAGER_PRIVATE_IP WORKER_PRIVATE_IP VPC_ID VPC_SUBNET_IDS SWARM_SECURITY_GROUP_ID LAMBDA_ROLE_NAME \
            JWT_ISSUER_URI JWT_CLIENT_ID CORS_ALLOWED_ORIGINS DEPLOY_ROOT; do
            [[ -n "${!name:-}" ]] || { printf 'Missing GitHub variable: %s\n' "$name" >&2; exit 1; }
          done
          [[ "$DEPLOY_ROOT" =~ ^/[A-Za-z0-9_./-]+$ ]] || {
            printf 'DEPLOY_ROOT must be an absolute path without spaces.\n' >&2
            exit 1
          }
          printf 'AWS_REGION=%s\nEP3_STACK_NAME=%s\nMANAGER_INSTANCE_ID=%s\nWORKER_INSTANCE_ID=%s\n' \
            "$AWS_REGION" "$EP3_STACK_NAME" "$MANAGER_INSTANCE_ID" "$WORKER_INSTANCE_ID" > "$RUNNER_TEMP/ep3.env"
          printf 'MANAGER_PRIVATE_IP=%s\nWORKER_PRIVATE_IP=%s\nVPC_ID=%s\nVPC_SUBNET_IDS=%s\nSWARM_SECURITY_GROUP_ID=%s\n' \
            "$MANAGER_PRIVATE_IP" "$WORKER_PRIVATE_IP" "$VPC_ID" "$VPC_SUBNET_IDS" "$SWARM_SECURITY_GROUP_ID" >> "$RUNNER_TEMP/ep3.env"
          printf 'LAMBDA_ROLE_NAME=%s\nJWT_ISSUER_URI=%s\nJWT_CLIENT_ID=%s\nCORS_ALLOWED_ORIGINS=%s\n' \
            "$LAMBDA_ROLE_NAME" "$JWT_ISSUER_URI" "$JWT_CLIENT_ID" "$CORS_ALLOWED_ORIGINS" >> "$RUNNER_TEMP/ep3.env"

      - name: Build and publish Lambda image
        id: lambda
        env:
          LAMBDA_IMAGE_TAG: ${{ github.sha }}
        run: bash ./scripts/build-report-lambda.sh

      - name: Provision SQS, Lambda and API Gateway
        id: provision
        env:
          LAMBDA_IMAGE_URI: ${{ steps.lambda.outputs.image_uri }}
        run: bash ./scripts/provision-ep3.sh --env-file "$RUNNER_TEMP/ep3.env" --apply

      - name: Restrict direct BFF ingress
        env:
          NLB_SECURITY_GROUP_ID: ${{ steps.provision.outputs.bff_nlb_security_group_id }}
        run: |
          python3 scripts/lock-bff-ingress.py \
            --region "$AWS_REGION" \
            --swarm-security-group-id "$SWARM_SECURITY_GROUP_ID" \
            --nlb-security-group-id "$NLB_SECURITY_GROUP_ID" \
            --apply

      - name: Deploy Docker Swarm stack through Systems Manager
        env:
          QUEUE_URL: ${{ steps.provision.outputs.request_events_queue_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          command_text="cd '$DEPLOY_ROOT/barriodigital-infra' && git pull --ff-only origin main && ./scripts/deploy-aws.sh --env-file .env.aws --set SQS_EVENTS_ENABLED=true --set REQUEST_EVENTS_QUEUE_URL='$QUEUE_URL'"
          parameters="$(python3 -c 'import json,sys; print(json.dumps({"commands":[sys.argv[1]]}))' "$command_text")"
          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$MANAGER_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy BarrioDigital EP3 stack" \
            --parameters "$parameters" \
            --query Command.CommandId \
            --output text)"
          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$MANAGER_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$MANAGER_INSTANCE_ID" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output text
            exit 1
          fi
          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$MANAGER_INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text

      - name: Verify the deployment
        env:
          API_ENDPOINT: ${{ steps.provision.outputs.api_endpoint }}
          TARGET_GROUP_ARN: ${{ steps.provision.outputs.bff_target_group_arn }}
        run: |
          set -Eeuo pipefail
          aws elbv2 wait target-in-service --region "$AWS_REGION" --target-group-arn "$TARGET_GROUP_ARN"
          lambda_status="$(aws lambda get-function-configuration \
            --region "$AWS_REGION" \
            --function-name "$EP3_STACK_NAME-report-consumer" \
            --query '[State,LastUpdateStatus]' \
            --output text)"
          read -r lambda_state lambda_update_status <<< "$lambda_status"
          [[ "$lambda_state" == "Active" && "$lambda_update_status" == "Successful" ]] || {
            printf 'Lambda is not ready: %s\n' "$lambda_status" >&2
            exit 1
          }
          response="$(curl -sS -o /dev/null -w '%{http_code}' "$API_ENDPOINT/actuator/health")"
          [[ "$response" == "401" ]] || {
            printf 'Expected the Cognito authorizer to reject an unauthenticated request; received HTTP %s.\n' "$response" >&2
            exit 1
          }
