version: "3.9"

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_DATABASE: requests_db
      MYSQL_USER: barriodigital_app
      MYSQL_PASSWORD_FILE: /run/secrets/db_app_password
    secrets:
      - source: db_password
        target: db_password
      - source: db_app_password
        target: db_app_password
    configs:
      - source: mysql_init
        target: /docker-entrypoint-initdb.d/01-databases.sql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5

  eureka:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/barriodigital/eureka:${EUREKA_IMAGE_TAG:-latest}
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.10"
          memory: 256M
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  catalog:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/barriodigital/catalog:${CATALOG_IMAGE_TAG:-latest}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: catalog_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka:8761/eureka/}
    secrets:
      - source: db_app_password
        target: db_app_password
    networks:
      - backend
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
        preferences:
          - spread: node.hostname
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  requests:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/barriodigital/requests:${REQUESTS_IMAGE_TAG:-latest}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: requests_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka:8761/eureka/}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-ms}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      SQS_EVENTS_ENABLED: ${SQS_EVENTS_ENABLED:?Set SQS_EVENTS_ENABLED to true}
      REQUEST_EVENTS_QUEUE_URL: ${REQUEST_EVENTS_QUEUE_URL:?Set REQUEST_EVENTS_QUEUE_URL}
      SQS_POLL_INTERVAL_MS: ${SQS_POLL_INTERVAL_MS:-1000}
    secrets:
      - source: db_app_password
        target: db_app_password
    networks:
      - backend
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
        preferences:
          - spread: node.hostname
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  crews:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/barriodigital/crews:${CREWS_IMAGE_TAG:-latest}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: crews_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka:8761/eureka/}
    secrets:
      - source: db_app_password
        target: db_app_password
    networks:
      - backend
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "0.75"
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  report:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/barriodigital/report:${REPORT_IMAGE_TAG:-latest}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: report_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka:8761/eureka/}
    secrets:
      - source: db_app_password
        target: db_app_password
    networks:
      - backend
    ports:
      - target: 8087
        published: 8087
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "0.75"
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  bff:
    image: ${ECR_REGISTRY:?Set ECR_REGISTRY}/barriodigital/bff:${BFF_IMAGE_TAG:-latest}
    environment:
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://eureka:8761/eureka/}
      REQUESTS_SERVICE_URL: ${REQUESTS_SERVICE_URL:-http://requests:8081}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog:8082}
      CREWS_SERVICE_URL: ${CREWS_SERVICE_URL:-http://crews:8083}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL:-http://report:8087}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:?Set JWT_JWK_SET_URI}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?Set JWT_ISSUER_URI}
      JWT_CLIENT_ID: ${JWT_CLIENT_ID:?Set JWT_CLIENT_ID}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
    ports:
      - target: 8080
        published: ${BFF_PORT:-8080}
        protocol: tcp
        mode: ingress
    networks:
      - backend
    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1
        preferences:
          - spread: node.hostname
      resources:
        reservations:
          cpus: "0.25"
          memory: 256M
        limits:
          cpus: "1.00"
          memory: 768M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

networks:
  backend:
    driver: overlay
    attachable: true

volumes:
  mysql_data:

configs:
  mysql_init:
    file: ./docker/mysql/init/01-databases.sql

secrets:
  db_password:
    external: true
    name: barriodigital_db_password
  db_app_password:
    external: true
    name: barriodigital_db_app_password
