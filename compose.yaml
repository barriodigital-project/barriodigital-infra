name: barriodigital

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the workspace .env}
      MYSQL_DATABASE: requests_db
      MYSQL_USER: barriodigital_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in the workspace .env}
    configs:
      - source: mysql_init
        target: /docker-entrypoint-initdb.d/01-databases.sql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped

  eureka:
    image: barriodigital/eureka-server:local
    build:
      context: ./eureka-server
    ports:
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"
    restart: unless-stopped

  catalog:
    image: barriodigital/catalog:local
    build:
      context: ../ms-barriodigital-catalog
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: catalog_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in the workspace .env}
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
    expose:
      - "8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    restart: unless-stopped

  requests:
    image: barriodigital/requests:local
    build:
      context: ../ms-barriodigital-requests
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: requests_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in the workspace .env}
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
      CATALOG_SERVICE_URL: http://catalog:8082
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
    expose:
      - "8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      catalog:
        condition: service_healthy
    restart: unless-stopped

  crews:
    image: barriodigital/crews:local
    build:
      context: ../ms-barriodigital-crews
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: crews_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in the workspace .env}
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
    expose:
      - "8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    restart: unless-stopped

  report:
    image: barriodigital/report:local
    build:
      context: ../ms-barriodigital-report
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: report_db
      DB_USERNAME: barriodigital_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in the workspace .env}
      JPA_DDL_AUTO: update
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
    expose:
      - "8087"
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
    restart: unless-stopped

  bff:
    image: barriodigital/bff:local
    build:
      context: ../ms-barriodigital-bff
    environment:
      EUREKA_SERVER_URL: http://eureka:8761/eureka/
      REQUESTS_SERVICE_URL: http://requests:8081
      CATALOG_SERVICE_URL: http://catalog:8082
      CREWS_SERVICE_URL: http://crews:8083
      REPORT_SERVICE_URL: http://report:8087
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-https://example.invalid/.well-known/jwks.json}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:8089}
      JWT_CLIENT_ID: ${JWT_CLIENT_ID:-local-test-client}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      HTTP_CONNECT_TIMEOUT: ${HTTP_CONNECT_TIMEOUT:-2s}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
    ports:
      - "127.0.0.1:${BFF_PORT:-8080}:8080"
    depends_on:
      eureka:
        condition: service_healthy
      requests:
        condition: service_healthy
      catalog:
        condition: service_healthy
      crews:
        condition: service_healthy
      report:
        condition: service_healthy
    restart: unless-stopped

configs:
  mysql_init:
    file: ./docker/mysql/init/01-databases.sql

volumes:
  mysql_data:
